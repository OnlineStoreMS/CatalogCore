server:
  port: 8104
  mode: debug

database:
  driver: postgres
  postgres_dsn: "host=127.0.0.1 user=catalogcore password=catalogcore dbname=catalogcore port=5432 sslmode=disable TimeZone=Asia/Shanghai"

auth:
  enabled: true
  jwt_secret: "与 UserCore 一致"

storage:
  driver: local
  prefix: "uploads"
  local_path: "./data/uploads"
  public_base_url: "http://127.0.0.1:8104/uploads"
  minio:
    endpoint: "127.0.0.1:9100"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "catalogcore"
    use_ssl: false
    prefix: "uploads"
    public_read: true

cors:
  allow_origins:
    - "http://localhost:5188"
    - "http://127.0.0.1:5188"
    - "http://localhost:5174"
    - "http://127.0.0.1:5174"
